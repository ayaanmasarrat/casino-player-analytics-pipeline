[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "casino-analytics"
version = "0.1.0"
description = "Casino player analytics pipeline — feature engineering, segmentation, and causal inference on synthetic data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ayaan Masarrat", email = "ayaanm1346@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
casino-analytics = "casino_analytics.cli:main"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
